<!DOCTYPE html><html lang="cs"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Czech Cases & Prepositions</title><style>
:root{font-family:system-ui,sans-serif;color:#152c46;background:#edf2f8;font-size:16px}*{box-sizing:border-box}body{margin:0}header{background:#153750;color:white;padding:22px max(20px,calc((100vw - 1060px)/2));display:flex;justify-content:space-between;align-items:center;gap:15px}h1{font-size:1.5rem;margin:0}header p{margin:6px 0 0;color:#cce5f2}main{max-width:1060px;margin:24px auto;padding:0 20px}.settings,.tools,.characters{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.settings{margin-bottom:22px}label{display:flex;flex-direction:column;gap:6px;font-size:.9rem;font-weight:600}button,select,input,textarea{font:inherit;border:1px solid #b5c6d8;border-radius:8px;padding:11px;background:white;color:#153750}button{cursor:pointer}button:hover{background:#e5f1f8}button:disabled{opacity:.5;cursor:default}button.primary{background:#087978;color:white;border-color:#087978}select{max-width:100%}.card{background:white;border:1px solid #d4deea;border-radius:16px;padding:30px;box-shadow:0 8px 30px #18334d09}.meta{display:flex;justify-content:space-between;color:#54677b;font-size:.9rem}.verb{font-weight:700;color:#087978;font-size:1.15rem;margin-top:25px}.sentence{font-size:1.6rem;line-height:1.6;margin:15px 0}.translation{color:#5a6a7b;line-height:1.5;margin:12px 0 20px}textarea{width:100%;min-height:94px;resize:vertical}.answer-row{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}.answer-row select{min-width:180px}.characters{gap:5px;margin:10px 0}.characters button{padding:7px 11px}.tools{margin-top:20px}.feedback,.hint{padding:16px;border-radius:8px;margin-top:20px;line-height:1.6}.feedback.good{background:#e4f4ed}.feedback.bad{background:#fff0e9}.hint{background:#edf5fb}.hidden{display:none!important}.progress{height:6px;background:#d6e2eb;border-radius:4px;margin:16px 0}.progress span{display:block;height:100%;background:#087978;border-radius:4px}details{margin-top:22px;padding:20px;background:white;border-radius:12px;border:1px solid #d4deea}summary{cursor:pointer;font-weight:600}table{border-collapse:collapse;width:100%;margin-top:16px}td,th{text-align:left;border-bottom:1px solid #dfe6ee;padding:10px}footer{font-size:.9rem;color:#596c80;margin:20px 0;line-height:1.6}#voiceStatus{margin:10px 0;color:#53667b}button:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #e0a626;outline-offset:3px}@media(max-width:600px){header{display:block}.card{padding:20px}.sentence{font-size:1.3rem}.settings label{width:100%}.settings select{width:100%}.tools button{flex:1}main{padding:0 12px}}
</style></head><body><header><div><h1 id="title"></h1><p id="subtitle"></p></div><span id="score"></span></header><main><div class="settings"><label><span id="modeLabel"></span><select id="mode"><option value="easy">Easy · Čeština + English</option><option value="normal">Normal · Čeština</option></select></label><label><span id="levelLabel"></span><select id="level"></select></label><label><span id="setLabel"></span><select id="setFilter"><option value="all">Všech 150 sloves</option><option value="homework">Domácí úkol · 38</option><option value="expanded">Nová sada · 112</option></select></label><label><span id="verbLabel"></span><select id="verbFilter"></select></label></div><div class="card"><div class="meta"><span id="position"></span><span id="levelName"></span></div><div class="progress"><span id="bar"></span></div><div class="verb" id="verb"></div><p id="instruction"></p><div class="sentence" id="sentence"></div><div class="translation" id="translation"></div><div class="answer-row" id="dropdowns"><label><span id="formLabel"></span><select id="form"><option value=""></option></select></label><label id="caseBox"><span id="caseLabel"></span><select id="case"></select></label></div><div id="writing"><textarea id="answer" spellcheck="false" autocomplete="off" aria-label="Odpověď / Answer"></textarea><div class="characters" id="chars"></div><button id="record"></button><p id="voiceStatus" role="status"></p></div><div class="tools"><button class="primary" id="check"></button><button class="primary hidden" id="next"></button><button id="speak"></button><button id="hintButton"></button><button id="shuffle"></button><button id="skip"></button></div><div id="feedback" class="feedback hidden" role="status" aria-live="polite"></div><div id="hint" class="hint hidden"></div></div><details><summary id="rulesTitle"></summary><div id="rules"></div></details><footer id="footer"></footer></main><script src="data.js"></script><script src="app.js"></script></body></html>
